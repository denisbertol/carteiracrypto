<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carteira Crypto">
  <meta name="referrer" content="no-referrer">
  <meta name="supabase-url" content="{{ supabase_url }}">
  <meta name="supabase-publishable-key" content="{{ supabase_publishable_key }}">
  <meta name="google-client-id" content="{{ google_client_id }}">
  <title>Carteira Crypto</title>
  <link rel="icon" href="/static/app-icon.png?v={{ asset_version }}" type="image/png">
  <link rel="apple-touch-icon" href="/static/app-icon.png?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
  <div id="splash" class="splash" role="dialog" aria-modal="true" aria-label="Carregando Carteira Crypto" hidden>
    <div class="splash-content">
      <div class="splash-media">
        <video id="splash-video" class="splash-video" playsinline preload="auto" src="/static/abertura_carteiracrypto.mp4?v={{ asset_version }}"></video>
      </div>
      <div class="splash-progress-container">
        <div class="splash-progress-track" role="progressbar" aria-label="Progresso do carregamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="splash-progress-bar" class="splash-progress-bar"></div>
        </div>
        <p id="splash-status-text" class="splash-status-text" aria-live="polite">Carregando carteira…</p>
      </div>
    </div>
    <noscript><style>#splash{display:none}body.has-splash{overflow:auto}</style></noscript>
  </div>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <img class="brand-mark" src="/static/app-icon.png?v={{ asset_version }}" alt="">
        <div>
          <h1>Carteira Crypto</h1>
          <p class="muted brand-subtitle">Carteira, alocação e monitoramento de preços</p>
        </div>
      </div>
      <button id="logout-button" class="btn btn-ghost" type="button" hidden>Sair</button>
    </div>
  </header>
  <main id="app-shell" class="container">
    <p id="session-status" class="session-status" role="status">Entre para consultar sua carteira.</p>
    <div id="login-container" class="login-container">
      <div class="login-card card">
        <div class="login-header">
          <div class="login-badge-icon">
            <img class="login-logo" src="/static/app-icon.png?v={{ asset_version }}" alt="Logo">
          </div>
          <h2 class="login-title">Acesse sua carteira</h2>
          <p class="login-subtitle">Gestão patrimonial, alocação e preços em tempo real</p>
        </div>

        <button id="google-login-btn" class="btn btn-google" type="button" aria-label="Entrar com a conta Google">
          <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span class="btn-google-text">Entrar com o Google</span>
        </button>

        <div class="login-divider" role="separator">
          <span>ou com seu e-mail</span>
        </div>

        <form id="login-form" class="login-form" autocomplete="on">
          <div class="field">
            <label for="login-email" class="field-label">E-mail</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input id="login-email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="seu@email.com" required>
            </div>
          </div>

          <div class="field">
            <label for="login-password" class="field-label">Senha</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
              <button id="toggle-password" type="button" class="btn-toggle-password" aria-label="Mostrar ou ocultar senha" tabindex="-1">
                <svg class="eye-icon eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-icon eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
              </button>
            </div>
          </div>

          <button id="login-submit-btn" class="btn btn-primary btn-submit" type="submit">
            <span>Entrar</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>

          <p id="auth-error" class="form-error" role="alert" hidden></p>
        </form>

        {% if dev_login %}
        <div class="dev-login-wrap">
          <button id="dev-login" class="btn btn-dev-shortcut" type="button" data-email="{{ dev_login.email }}" data-password="{{ dev_login.password }}">
            <span class="dev-badge">DEV</span>
            <span>Entrar como Denis</span>
          </button>
        </div>
        {% endif %}

        <div class="login-footer">
          <p class="security-note">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Autenticação segura via Supabase
          </p>
        </div>
      </div>
    </div>
    <section id="app-content" aria-live="off"></section>
    <noscript>Ative JavaScript para acessar sua carteira.</noscript>
  </main>
  <script src="/static/auth.js?v={{ asset_version }}" defer></script>
  <script src="/static/splash.js?v={{ asset_version }}" defer></script>
  <script src="/static/charts.js?v={{ asset_version }}" defer></script>
  <script src="/static/portfolio.js?v={{ asset_version }}" defer></script>
  <script src="/static/operations.js?v={{ asset_version }}" defer></script>
  <script src="/static/targets.js?v={{ asset_version }}" defer></script>
  <script src="/static/ai.js?v={{ asset_version }}" defer></script>
  <script src="/static/monitoring.js?v={{ asset_version }}" defer></script>
</body>
</html>
